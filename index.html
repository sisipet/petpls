nt-size:14px;font-weight:600;cursor:pointer;border:none;transition:all 0.2s ease;font-family:inherit;display:inline-flex;align-items:center;justify-content:center;gap:6px;}.btn-primary{background:var(--accent-orange);color:white;}.btn-primary:hover{background:#C8875A;transform:translateY(-1px);}.btn-secondary{background:var(--accent-blue-light);color:var(--accent-blue);}.btn-secondary:hover{background:#A8C8E0;}.btn-danger{background:#F5D5D5;color:var(--danger);}.btn-outline{background:transparent;color:var(--text-secondary);border:1px solid var(--card-border);}.btn-outline:hover{background:var(--sidebar-bg);}.btn-group{display:flex;gap:10px;margin-top:16px;}.tab-switcher{display:flex;gap:8px;margin-bottom:16px;}.tab-switcher .btn{flex:1;margin:0;}.data-table{width:100%;border-collapse:collapse;font-size:13px;}.data-table th{text-align:left;padding:10px 12px;font-weight:600;color:var(--text-secondary);border-bottom:2px solid var(--card-border);font-size:12px;text-transform:uppercase;letter-spacing:0.5px;}.data-table td{padding:12px;border-bottom:1px solid var(--card-border);color:var(--text-primary);}.data-table tr:hover td{background:rgba(212,149,106,0.04);}.amount-positive{color:var(--success);font-weight:600;}.amount-negative{color:var(--danger);font-weight:600;}.amount-net{color:var(--accent-blue);font-weight:600;}.deal-card{background:var(--card-bg);border-radius:14px;padding:18px;margin-bottom:14px;box-shadow:0 2px 8px var(--shadow);border:1px solid var(--card-border);border-left:4px solid var(--accent-orange);}.deal-card.blue{border-left-color:var(--accent-blue);}.deal-store{font-size:15px;font-weight:700;color:var(--text-primary);margin-bottom:8px;display:flex;align-items:center;gap:8px;}.deal-store .store-icon{font-size:20px;}.deal-content{font-size:13px;color:var(--text-secondary);line-height:1.7;}.deal-content strong{color:var(--text-primary);}.deal-tag{display:inline-block;background:var(--sidebar-bg);color:var(--sidebar-text);padding:3px 10px;border-radi <script>const store = {
catOfflineIncome: JSON.parse(localStorage.getItem('catOfflineIncome') || '[]'),
catOfflineExpense: JSON.parse(localStorage.getItem('catOfflineExpense') || '[]'),
salesOfflineIncome: JSON.parse(localStorage.getItem('salesOfflineIncome') || '[]'),
salesOfflineStock: JSON.parse(localStorage.getItem('salesOfflineStock') || '[]'),
salesOfflineNet: JSON.parse(localStorage.getItem('salesOfflineNet') || '[]'),
catOnlineIncome: JSON.parse(localStorage.getItem('catOnlineIncome') || '[]'),
salesOnlineIncome: JSON.parse(localStorage.getItem('salesOnlineIncome') || '[]'),
salesOnlineNet: JSON.parse(localStorage.getItem('salesOnlineNet') || '[]'),
salary: JSON.parse(localStorage.getItem('salary') || '[]'),
rentStore1: JSON.parse(localStorage.getItem('rentStore1') || '[]'),
rentStore2: JSON.parse(localStorage.getItem('rentStore2') || '[]'),
};
const pageTitles = {
'dashboard': '<strong>总日收入</strong>',
'monthly': '<strong>月收支总览</strong>',
'cat-offline-income': '猫房线下 <strong>每日进账</strong>',
'cat-offline-expense': '猫房线下 <strong>每月出账</strong>',
'sales-offline-income': '销售线下 <strong>每日进账</strong>',
'sales-offline-stock': '销售线下 <strong>每月进货</strong>',
'sales-offline-net': '销售线下 <strong>每日净收</strong>',
'cat-online-income': '猫房线上 <strong>每日进账</strong>',
'sales-online-income': '销售线上 <strong>每日进账</strong>',
'sales-online-net': '销售线上 <strong>每日净收</strong>',
'salary': '<strong>员工工资</strong> 记录',
'rent-store1': '<strong>一店</strong> 店租支出',
'rent-store2': '<strong>二店</strong> 店租支出',
'deals': '<strong>折扣活动</strong> 汇总',
'data-manage': '<strong>数据管理</strong>'
};
const storeKeys = {
'cat-offline-income': 'catOfflineIncome',
'cat-offline-expense': 'catOfflineExpense',
'sales-offline-income': 'salesOfflineIncome',
'sales-offline-stock': 'salesOfflineStock',
'sales-offline-net': 'salesOfflineNet',
'cat-online-income': 'catOnlineIncome',
'sales-online-income': 'salesOnlineIncome',
'sales-online-net': 'salesOnlineNet',
'salary': 'salary',
'rent-store1': 'rentStore1',
'rent-store2': 'rentStore2'
};
let currentPage = 'dashboard';
document.addEventListener('DOMContentLoaded', () => {
document.getElementById('currentDate').textContent = new Date().toISOString().split('T')[0];
showPage('dashboard');
});
function toggleSidebar() {
document.getElementById('sidebar').classList.toggle('open');
document.getElementById('sidebarOverlay').classList.toggle('active');
}
function showPage(page) {
currentPage = page;
document.getElementById('pageTitle').innerHTML = pageTitles[page] || '<strong>工作台</strong>';
document.querySelectorAll('.nav-item').forEach(item => {
item.classList.remove('active');
if (item.dataset.page === page) item.classList.add('active');
});
if (window.innerWidth <= 768) {
document.getElementById('sidebar').classList.remove('open');
document.getElementById('sidebarOverlay').classList.remove('active');
}
const content = document.getElementById('contentArea');
content.innerHTML = '';
content.classList.remove('fade-in');
void content.offsetWidth;
content.classList.add('fade-in');
switch(page) {
case 'dashboard': renderDashboard(content); break;
case 'monthly': renderMonthly(content); break;
case 'deals': renderDeals(content); break;
case 'data-manage': renderDataManage(content); break;
default: renderDataEntry(content, page);
}
}
function renderDashboard(container) {
const today = new Date().toISOString().split('T')[0];
const yesterday = getYesterday(today);
const todayCatOffline = sumByDate(store.catOfflineIncome, today);
const todaySalesOffline = sumByDate(store.salesOfflineIncome, today);
const todayCatOnline = sumByDate(store.catOnlineIncome, today);
const todaySalesOnline = sumByDate(store.salesOnlineIncome, today);
const yestCatOffline = sumByDate(store.catOfflineIncome, yesterday);
const yestSalesOffline = sumByDate(store.salesOfflineIncome, yesterday);
const yestCatOnline = sumByDate(store.catOnlineIncome, yesterday);
const yestSalesOnline = sumByDate(store.salesOnlineIncome, yesterday);
const totalIncome = todayCatOffline + todaySalesOffline + todayCatOnline + todaySalesOnline;
const yestTotal = yestCatOffline + yestSalesOffline + yestCatOnline + yestSalesOnline;
const change = yestTotal > 0 ? ((totalIncome - yestTotal) / yestTotal * 100) : 0;
const changeText = change >= 0 ? `▲ ${change.toFixed(0)}%` : `▼ ${Math.abs(change).toFixed(0)}%`;
const totalRecords = store.catOfflineIncome.filter(r => r.date === today).length
+ store.salesOfflineIncome.filter(r => r.date === today).length
+ store.catOnlineIncome.filter(r => r.date === today).length
+ store.salesOnlineIncome.filter(r => r.date === today).length;
container.innerHTML = `
<div class="hero-card">
<div class="hero-icon">📅</div>
<div class="hero-info">

<li><span class="label">📦 销售线下进货</span><span class="value">${store.salesOfflineStock.length} 条</span></li>
<li><span class="label">💰 销售线下净收</span><span class="value">${store.salesOfflineNet.length} 条</span></li>
<li><span class="label">🌐 猫房线上进账</span><span class="value">${store.catOnlineIncome.length} 条</span></li>
<li><span class="label">📱 销售线上进账</span><span class="value">${store.salesOnlineIncome.length} 条</span></li>
<li><span class="label">💵 销售线上净收</span><span class="value">${store.salesOnlineNet.length} 条</span></li>

<li><span class="label">🏪 二店店租</span><span class="value">${store.rentStore2.length} 条</span></li>
</ul>
</div>
<div class="card">
<div class="card-header">
<span class="card-title">危险操作</span>
</div>
<div class="data-actions">
<button class="btn btn-danger" onclick="if(confirm('⚠️ 此操作将删除所有数据，不可恢复！确定要继续吗？')){clearAllData()}">🗑️ 清空所有数据</button>
</div>
</div>
`;
const data = {};
for (const key of Object.keys(store)) {
data[key] = JSON.parse(localStorage.getItem(key) || '[]');
}
document.getElementById('exportArea').value = JSON.stringify(data);
}
function sumByDate(data, date) {
return data.filter(r => r.date === date).reduce((s, r) => s + parseFloat(r.amount || 0), 0);
}
function sumByMonth(data, month) {
return data.filter(r => r.date.startsWith(month)).reduce((s, r) => s + parseFloat(r.amount || 0), 0);
}
function getYesterday(today) {
const d = new Date(today);
d.setDate(d.getDate() - 1);
return d.toISOString().split('T')[0];
}
function formatDate(dateStr) {
const parts = dateStr.split('-');
return `${parts[1]}/${parts[2]}/${parts[0]}`;
}
function getBarHeight(maxVal, compareVal, val) {
if (maxVal === 0 && compareVal === 0) return 10;
const max = Math.max(maxVal, compareVal, 1);
return Math.max((val / max) * 80, 10);
}
function getLast7Days() {
const days = [];
for (let i = 6; i >= 0; i--) {
const d = new Date();
d.setDate(d.getDate() - i);
days.push(d.toISOString().split('T')[0]);
}
return days;
}
function getLast7DaysData(data) {
const days = getLast7Days();
return days.map(date => ({
date,
amount: sumByDate(data, date),
label: date.substring(5),
isToday: date === new Date().toISOString().split('T')[0]
}));
}
function renderTrendChart(data, title) {
const trendData = getLast7DaysData(data);
const maxVal = Math.max(...trendData.map(d => d.amount), 1);
const today = new Date().toISOString().split('T')[0];
return `
<div class="trend-chart-card">
<div class="chart-header">
<span class="icon">📈</span> ${title || '近7天趋势'}
</div>
<div class="trend-chart-container">
${trendData.map(d => `
<div class="trend-bar-group">
<div class="trend-bar ${d.isToday ? 'today' : ''}" style="height: ${Math.max((d.amount / maxVal) * 120, 4)}px;">
<span class="trend-bar-value">$${d.amount.toFixed(2)}</span>
</div>
<div class="trend-bar-label ${d.isToday ? 'today' : ''}">${d.isToday ? '今天' : d.label}</div>
</div>
`).join('')}
</div>
</div>
`;
}
function renderCompareChart(todayVal, yestVal, todayDate, yestDate) {
return `
<div class="chart-card">
<div class="chart-header">
<span class="icon">📊</span> 与昨日对比
</div>
<div class="chart-container">
<div class="chart-bar-group">
<div class="chart-bar-wrapper">
<div class="chart-bar orange" style="height: ${getBarHeight(todayVal, yestVal, todayVal)}px;">
<span class="chart-bar-value">$${todayVal.toFixed(2)}</span>
</div>
</div>
<div class="chart-bar-label">${todayDate.substring(5)}</div>
</div>
<div class="chart-bar-group">
<div class="chart-bar-wrapper">
<div class="chart-bar blue" style="height: ${getBarHeight(todayVal, yestVal, yestVal)}px;">
<span class="chart-bar-value">$${yestVal.toFixed(2)}</span>
</div>
</div>
<div class="chart-bar-label">${yestDate.substring(5)}</div>
</div>
</div>
<div class="chart-legend">
<div class="chart-legend-item">
<div class="chart-legend-dot orange"></div>
<span>当天</span>
</div>
<div class="chart-legend-item">
<div class="chart-legend-dot blue"></div>
<span>前一天</span>
</div>
</div>
</div>
`;
}
function addEntry(key) {
const date = document.getElementById('entryDate').value;
const amount = document.getElementById('entryAmount').value;
const note2 = document.getElementById('entryNote2')?.value || '';
if (!date || !amount) {
showToast('请填写日期和金额', 'error');
return;
}
const entry = { date, amount: parseFloat(amount), note: note2 };
if (key === 'salary') {
const name = document.getElementById('entryName')?.value;
if (name) entry.name = name;
const hours = document.getElementById('entryHours')?.value;
if (hours) entry.hours = parseFloat(hours);
const hourlyRate = document.getElementById('entryHourlyRate')?.value;
if (hourlyRate) entry.hourlyRate = parseFloat(hourlyRate);
const commission = document.getElementById('entryCommission')?.value;
if (commission) entry.commission = parseFloat(commission);
}
if (key === 'rentStore1' || key === 'rentStore2') {
const note = document.getElementById('entryNote')?.value;
if (note) entry.note = note;
}
store[key].push(entry);
localStorage.setItem(key, JSON.stringify(store[key]));
showToast('记录已保存', 'success');
showPage(currentPage);
}
function deleteEntry(key, index) {
store[key].splice(index, 1);
localStorage.setItem(key, JSON.stringify(store[key]));
showToast('记录已删除', 'success');
showPage(currentPage);
}
function clearAll(key) {
store[key] = [];
localStorage.setItem(key, JSON.stringify([]));
showToast('所有记录已清空', 'success');
showPage(currentPage);
}
function clearForm() {
document.getElementById('entryAmount').value = '';
document.getElementById('entryNote2') && (document.getElementById('entryNote2').value = '');
document.getElementById('entryName') && (document.getElementById('entryName').value = '');
document.getElementById('entryNote') && (document.getElementById('entryNote').value = '');
document.getElementById('entryHours') && (document.getElementById('entryHours').value = '');
document.getElementById('entryHourlyRate') && (document.getElementById('entryHourlyRate').value = '');
document.getElementById('entryCommission') && (document.getElementById('entryCommission').value = '');
const calcEl = document.getElementById('salaryCalc');
if (calcEl) calcEl.textContent = '$0.00';
}
function calcSalary() {
const hours = parseFloat(document.getElementById('entryHours')?.value || 0);
const rate = parseFloat(document.getElementById('entryHourlyRate')?.value || 0);
const commission = parseFloat(document.getElementById('entryCommission')?.value || 0);
const total = hours * rate + commission;
const calcEl = document.getElementById('salaryCalc');
if (calcEl) calcEl.textContent = '$' + total.toFixed(2);
const amountEl = document.getElementById('entryAmount');
if (amountEl && (hours > 0 || rate > 0 || commission > 0)) {
amountEl.value = total.toFixed(2);
}
}
function copyExportData() {
const exportArea = document.getElementById('exportArea');
exportArea.select();
exportArea.setSelectionRange(0, 99999);
try {
document.execCommand('copy');
showToast('数据已复制到剪贴板', 'success');
} catch (e) {
if (navigator.clipboard) {
navigator.clipboard.writeText(exportArea.value).then(() => {
showToast('数据已复制到剪贴板', 'success');
}).catch(() => {
showToast('请手动长按文本选择复制', 'error');
});
} else {
showToast('请手动长按文本选择复制', 'error');
}
}
}
function importFromText() {
const text = document.getElementById('importArea').value.trim();
if (!text) {
showToast('请先粘贴备份数据', 'error');
return;
}
try {
const data = JSON.parse(text);
let count = 0;
for (const [key, value] of Object.entries(data)) {
if (store.hasOwnProperty(key) && Array.isArray(value)) {
localStorage.setItem(key, JSON.stringify(value));
store[key] = value;
count++;
}
}
if (count > 0) {
showToast('数据导入成功（' + count + ' 个模块）', 'success');
showPage('data-manage');
} else {
showToast('未找到有效数据', 'error');
}
} catch (err) {
showToast('导入失败：数据格式错误', 'error');
}
}
function clearAllData() {
for (const key of Object.keys(store)) {
localStorage.removeItem(key);
store[key] = [];
}
showToast('所有数据已清空', 'success');
showPage('data-manage');
}
function showToast(message, type = '') {
const container = document.getElementById('toastContainer');
const toast = document.createElement('div');
toast.className = `toast ${type}`;
toast.textContent = message;
container.appendChild(toast);
setTimeout(() => {
toast.style.opacity = '0';
toast.style.transform = 'translateY(10px)';
setTimeout(() => toast.remove(), 300);
}, 2500);
}</script>
